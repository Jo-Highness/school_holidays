name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Fixes"
    labels:
      - "fix"
      - "bug"
  - title: "📝 Documentation"
    labels:
      - "docs"
      - "documentation"
  - title: "🔧 CI"
    labels:
      - "ci"
  - title: "🧹 Chore"
    labels:
      - "chore"
      - "refactor"
      - "dependencies"
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - "major"
      - "breaking"
  minor:
    labels:
      - "minor"
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "patch"
      - "fix"
      - "bug"
      - "docs"
      - "ci"
      - "chore"
  default: patch
autolabeler:
  - label: "feature"
    title:
      - "/^feat(\\(.+\\))?!?:/i"
  - label: "fix"
    title:
      - "/^fix(\\(.+\\))?!?:/i"
  - label: "docs"
    title:
      - "/^docs(\\(.+\\))?!?:/i"
  - label: "ci"
    title:
      - "/^ci(\\(.+\\))?!?:/i"
  - label: "chore"
    title:
      - "/^(chore|refactor|test|build|perf)(\\(.+\\))?!?:/i"
template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/Jo-Highness/school_holidays/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
